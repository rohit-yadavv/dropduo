name: Checks
on:
  push:
    branches: [develop, staging, master]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check macos
      - run: ./scripts/build-macos
      - run: ditto -c -k --sequesterRsrc --keepParent dist/DropDuo.app dist/DropDuo-macos-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dropduo-macos-development
          path: dist/DropDuo-macos-development.zip
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./scripts/check android
      - uses: actions/upload-artifact@v4
        with:
          name: dropduo-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
  interoperability:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/interop
