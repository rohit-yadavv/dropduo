name: CodeQL
on:
  # Scan code changes once before production and weekly; earlier promotion PRs carry the same code.
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'apps/web/**']
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {language: java-kotlin, runner: ubuntu-24.04}
          - {language: swift, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-android
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
      - if: matrix.language == 'java-kotlin'
        run: ./apps/android/gradlew -p apps/android :app:assembleDebug --no-build-cache --no-daemon --console=plain
      - if: matrix.language == 'swift'
        run: swift build --package-path apps/macos --product DropDuo
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with: {category: "/language:${{ matrix.language }}"}
