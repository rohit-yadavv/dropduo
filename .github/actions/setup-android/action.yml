name: Set up DropDuo Android toolchain
description: Java 17, Gradle cache and SDK 36; avoids obsolete SDK tools package
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with: {distribution: temurin, java-version: '17'}
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      shell: bash
