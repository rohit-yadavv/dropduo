name: Release
# Actions → Release → Run workflow: picks the next version from the tags, builds master, tags it and publishes
# the release with its downloads. No version bump in code. Checks already ran when the commit reached master.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Leave empty for the next alpha (for example 0.1.0-alpha.7).
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      mode: ${{ steps.metadata.outputs.mode }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - id: metadata
        name: Pick the version, build number and signing mode
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/check-release "$VERSION" | tee -a "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
  macos:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env: {DROPDUO_VERSION: "${{ needs.gate.outputs.version }}", DROPDUO_BUILD: "${{ needs.gate.outputs.build }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.gate.outputs.commit }}", persist-credentials: false}
      - name: Import Developer ID into ephemeral keychain
        if: needs.gate.outputs.mode == 'distribution'
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          DROPDUO_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: ./scripts/macos-distribution install
      - name: Build development app
        if: needs.gate.outputs.mode == 'development'
        run: ./scripts/build-macos
      - name: Build signed app
        if: needs.gate.outputs.mode == 'distribution'
        env:
          DROPDUO_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: ./scripts/build-macos
      - name: Notarize, staple and assess
        if: needs.gate.outputs.mode == 'distribution'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/macos-distribution notarize
      - name: Verify and package
        env: {MODE: "${{ needs.gate.outputs.mode }}"}
        run: |
          codesign --verify --deep --strict dist/DropDuo.app
          ./scripts/package-download macos "$MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials
        if: always() && needs.gate.outputs.mode == 'distribution'
        run: ./scripts/macos-distribution cleanup
  android:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: {DROPDUO_VERSION: "${{ needs.gate.outputs.version }}", DROPDUO_BUILD: "${{ needs.gate.outputs.build }}"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.gate.outputs.commit }}", persist-credentials: false}
      - uses: ./.github/actions/setup-android
      - name: Development APK
        if: needs.gate.outputs.mode == 'development'
        run: ./apps/android/gradlew -p apps/android :app:assembleDebug --console=plain
      - name: Signed release APK
        if: needs.gate.outputs.mode == 'distribution'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DROPDUO_ANDROID_KEYSTORE: ${{ runner.temp }}/dropduo-release.jks
          DROPDUO_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DROPDUO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DROPDUO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ['ANDROID_KEYSTORE_BASE64', 'DROPDUO_ANDROID_STORE_PASSWORD', 'DROPDUO_ANDROID_KEY_ALIAS', 'DROPDUO_ANDROID_KEY_PASSWORD']:
              if not os.environ.get(name):
                  raise SystemExit('Missing signing configuration: ' + name)
          path = Path(os.environ['DROPDUO_ANDROID_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
          ./apps/android/gradlew -p apps/android :app:assembleRelease --no-daemon --console=plain
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose apps/android/app/build/outputs/apk/release/app-release.apk
      - name: Package
        env: {MODE: "${{ needs.gate.outputs.mode }}"}
        run: ./scripts/package-download android "$MODE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dropduo-release.jks"
  publish:
    needs: [gate, macos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.gate.outputs.commit }}", persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Assemble checksums, notices and release notes
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: python3 scripts/release-notes.py
      - name: Tag master and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          # GitHub lists the pull requests merged since the previous release under the install notes.
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$COMMIT" --jq .body >> dist/release-notes.md
          # Creates the tag on the built commit. Never overwrites: an existing tag or release fails here.
          # Releases are never marked pre-release, so GitHub and the website offer the newest build.
          gh release create "$TAG" dist/release/* --target "$COMMIT" --title "DropDuo $TAG" --notes-file dist/release-notes.md
